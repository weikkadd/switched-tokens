name: Switched Cloud 自动获取金币

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  switched-tokens:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils
          pip install seleniumbase requests
          seleniumbase install chromedriver

      - name: 设置代理
        if: env.NODE_LINK != ''
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh | bash

      - name: 运行金币脚本
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          SWITCHED_COOKIE: ${{ secrets.SWITCHED_COOKIE }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          MAX_TOKENS: '25'
          AD_WAIT: '120'
          COOLDOWN: '5'
          IS_PROXY: 'true'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python renew.py

      - name: 清理进程和临时文件
        if: always()
        run: |
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
